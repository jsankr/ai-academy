<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="Practical AI agent exercise"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#193354"/><stop offset=".65" stop-color="#0a1525"/><stop offset="1" stop-color="#10213b"/></linearGradient></defs><rect width="1200" height="660" rx="27" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="658" rx="27" fill="none" stroke="#536780"/><text x="53" y="58" font-size="24" font-weight="750" fill="#eff9ff">✦ AI <tspan fill="#85e4e1">Adventure Academy</tspan></text><line x1="50" y1="85" x2="1150" y2="85" stroke="#426078"/><text x="53" y="129" fill="#80e4df" font-size="18" font-weight="800" letter-spacing="2">AGENT LAB · PRACTICAL BUILD</text><text x="53" y="189" fill="#f3f8ff" font-size="42" font-weight="800">Morning Compass</text><text x="53" y="226" fill="#b4c6d8" font-size="19">Prototype a personal planner with sample tasks and approvals.</text><rect x="54" y="262" width="511" height="110" rx="17" fill="#0c1b30" stroke="#3b5870" /><text x="75" y="297" fill="#81e1dc" font-size="17" font-weight="750">INPUT</text><text x="75" y="329" fill="#dfebf8" font-size="17">Pay electricity bill · Meeting at 2 PM · Read a chap</text><text x="75" y="351" fill="#dfebf8" font-size="17">ter</text><rect x="586" y="262" width="511" height="110" rx="17" fill="#0c1b30" stroke="#3b5870" /><text x="607" y="297" fill="#81e1dc" font-size="17" font-weight="750">AGENT WORKFLOW</text><text x="607" y="329" fill="#dfebf8" font-size="17">Observe tasks  →  Prioritize  →  Draft plan  →  Revi</text><text x="607" y="351" fill="#dfebf8" font-size="17">ew</text><rect x="54" y="388" width="511" height="110" rx="17" fill="#0c1b30" stroke="#3b5870" /><text x="75" y="423" fill="#81e1dc" font-size="17" font-weight="750">OUTPUT</text><text x="75" y="455" fill="#dfebf8" font-size="17">Three priorities, realistic time blocks, and clear a</text><text x="75" y="477" fill="#dfebf8" font-size="17">ssumptions</text><rect x="586" y="388" width="511" height="110" rx="17" fill="#0c1b30" stroke="#3b5870" /><text x="607" y="423" fill="#81e1dc" font-size="17" font-weight="750">TEST</text><text x="607" y="455" fill="#dfebf8" font-size="17">What happens if the input has no deadlines?</text><rect x="53" y="547" width="1096" height="65" rx="15" fill="#1b393f" stroke="#467a79"/><text x="73" y="589" fill="#b8f4df" font-size="20" font-weight="750">BUILD SAFELY   No calendar changes without approval.</text><text x="1110" y="645" text-anchor="end" fill="#8298ac" font-size="12">ILLUSTRATIVE EXERCISE PREVIEW</text></svg>