· REFLECT</text><text x="607" y="455" fill="#dfebf8" font-size="17">Where was AI useful—and where did it guess?</text><rect x="53" y="547" width="1096" height="65" rx="15" fill="#1b393f" stroke="#467a79"/><text x="73" y="589" fill="#b8f4df" font-size="20" font-weight="750">MISSION 01   Explain AI to a friend in 90 seconds.</text><text x="1110" y="645" text-anchor="end" fill="#8298ac" font-size="12">ILLUSTRATIVE EXERCISE PREVIEW</text></svg>